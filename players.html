<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩家管理 — 農家樂 Agricola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="raters.css" />
</head>
<body>
  <div class="top-brand-bar">
    <div class="brand-left">
      <a href="./index.html" class="logo-link"><img src="./images/ugg-logo.png" alt="UGG Logo" class="ugg-logo" /></a>
      <div class="brand-text">
        <div class="brand-title">農家樂 Agricola — 玩家管理</div>
        <div class="brand-sub">管理員後台</div>
      </div>
    </div>
    <div class="brand-right">
      <a href="raters.html" class="back-link">評分者管理</a>
      <a href="draft.html" class="back-link">← 回輪抽模擬器</a>
    </div>
  </div>

  <main class="raters-main">

    <!-- Loading -->
    <div id="playersLoading" class="profile-state">
      <div class="state-icon">⏳</div>
      <p id="playersLoadingMsg">載入中…</p>
    </div>

    <!-- Not admin -->
    <div id="playersAuthRequired" class="profile-state" style="display:none">
      <div class="state-icon">🔐</div>
      <h2>需要管理員權限</h2>
      <p>請以管理員帳號登入後再查看此頁面。</p>
      <button class="profile-cta-btn" id="playersLoginBtn">管理員登入</button>
    </div>

    <!-- Main content -->
    <div id="playersContent" style="display:none">

      <div class="raters-header">
        <div class="raters-summary" id="playersSummary"></div>
        <div class="raters-sort">
          排序：
          <button class="sort-btn active" data-sort="count">場次</button>
          <button class="sort-btn" data-sort="lastActive">最近活躍</button>
          <button class="sort-btn" data-sort="createdAt">建立時間</button>
          <button class="sort-btn" id="refreshPlayersBtn">↻ 重新整理</button>
        </div>
      </div>

      <div class="raters-table-wrap">
        <table class="raters-table">
          <thead>
            <tr>
              <th>玩家 ID</th>
              <th>累積場次</th>
              <th>最後活躍</th>
              <th>建立時間</th>
              <th></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="playersTableBody"></tbody>
        </table>
      </div>

    </div>

  </main>

  <!-- Reset PIN Modal -->
  <div id="resetPinModal" class="auth-modal-overlay" style="display:none">
    <div class="auth-modal">
      <div class="auth-modal-title">重設玩家 PIN</div>
      <p class="player-auth-hint">玩家 ID：<strong id="resetPinTargetId"></strong><br/>輸入新的 PIN 後，請另外告知玩家本人。</p>
      <div class="auth-field">
        <label>新 PIN</label>
        <input type="text" id="resetPinInput" class="auth-input" placeholder="設定新的 PIN" autocomplete="off" />
      </div>
      <div class="auth-error" id="resetPinError"></div>
      <div class="auth-modal-footer">
        <button class="auth-btn-cancel" id="resetPinCancel">取消</button>
        <button class="auth-btn-submit" id="resetPinSubmit">確認重設</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="players.js"></script>
</body>
</html>
