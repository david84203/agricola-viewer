<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>農家樂 Agricola — 卡牌列表</title>
  <meta name="description" content="農家樂（Agricola）繁體中文化卡牌資料庫，收錄次要發展卡與職業卡的完整效果說明與卡片圖像。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="top-brand-bar">
    <div class="brand-left">
      <a href="./index.html" class="logo-link"><img src="./images/ugg-logo.png" alt="UGG Logo" class="ugg-logo" /></a>
      <div class="brand-text">
        <div class="brand-title">農家樂 Agricola 卡牌列表</div>
        <div class="brand-sub">台灣繁體中文版翻譯</div>
        <div id="authBarMount"></div>
      </div>
    </div>
    <div class="brand-center">
      翻譯、編輯、排版、網頁編寫為烏嘎嘎桌遊小路獨立製作，禁止用於任何商業用途。
    </div>
    <div class="brand-right">
      <div class="brand-count">
        共 <span id="totalCount" class="highlight">0</span> 張卡牌
        <span class="brand-count-sub">（有效 <span id="netCount">—</span> 張）</span>
      </div>
      <div class="brand-nav">
        <a href="./index.html" class="draft-nav-btn">首頁</a>
        <button id="banlistBtn" class="draft-nav-btn">🚫 禁卡表</button>
        <button id="banAdminBtn" class="draft-nav-btn" style="display:none">⚙️ 禁卡管理</button>
        <button id="bgaAdminBtn" class="draft-nav-btn" style="display:none">🎮 BGA管理</button>
        <a href="draft.html" class="draft-nav-btn">🎲 輪抽模擬器</a>
        <a href="tierlist.html" class="draft-nav-btn">📊 Tier List</a>
        <a href="duplicates.html" class="draft-nav-btn">🔁 重複卡牌</a>
        <a href="./list.html" class="draft-nav-btn">📋 文字列表版</a>
      </div>
    </div>
  </div>



  <main class="main-container">
    <!-- Filters -->
    <section class="filter-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="搜尋牌名、說明、卡片ID…"
          autocomplete="off"
        />
        <button class="clear-btn" id="clearSearch" title="清除">✕</button>
      </div>
      <div class="filter-chips-row">
        <div class="filter-chips">
          <button class="chip active" data-filter="all">全部</button>
          <button class="chip" data-filter="minor">次要發展卡</button>
          <button class="chip" data-filter="occupation">職業卡</button>
          <button class="chip" data-filter="both">雙色卡</button>
        </div>
        <button class="chip chip-toggle" id="excludeBanBtn">排除禁卡</button>
        <button class="chip chip-toggle" id="excludeDupBtn">排除重複</button>
      </div>
      <div class="deck-filter">
        <label for="deckSelect">牌組</label>
        <select id="deckSelect">
          <option value="latest" selected>最新</option>
          <option value="all">全部</option>
        </select>
      </div>
      <div class="deck-filter sort-filter">
        <label for="sortSelect">排序</label>
        <select id="sortSelect">
          <option value="default">預設順序</option>
          <option value="elo_desc">牌力 強 → 弱</option>
          <option value="elo_asc">牌力 弱 → 強</option>
        </select>
      </div>
    </section>

    <!-- Results info -->
    <div class="results-info" id="resultsInfo">載入中…</div>

    <!-- Card grid -->
    <section class="card-grid" id="cardGrid"></section>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-inner">
        <div class="modal-image-wrap">
          <canvas id="modalCanvas"></canvas>
        </div>
        <div class="modal-info">
          <div class="modal-title-row">
            <h2 class="modal-title" id="modalTitle"></h2>
            <div class="modal-badge" id="modalBadge"></div>
          </div>
          <div class="modal-sub-row">
            <div class="modal-id" id="modalId"></div>
            <span id="modalBanBadge" class="modal-ban-badge" style="display:none">禁卡</span>
            <span id="modalBgaBadge" class="modal-bga-badge" style="display:none">BGA</span>
            <span id="modalEffectsBadge" class="modal-effects-badge" style="display:none">⚙ 此卡已有結構化編碼</span>
            <span id="modalOnlineImplBadge" class="modal-online-impl-badge" style="display:none" title="">✅ 線上已實作</span>
          </div>
          <div class="modal-fields" id="modalFields"></div>
          <div class="modal-desc-wrap">
            <div class="modal-desc-label">說明</div>
            <div class="modal-desc" id="modalDesc"></div>
          </div>
          <div class="modal-effects-wrap" id="modalEffectsWrap" style="display:none">
            <div class="modal-desc-label">結構化卡效</div>
            <div class="modal-effects-body" id="modalEffectsBody"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Banlist Modal -->
  <div class="banlist-overlay" id="banlistOverlay">
    <div class="banlist-modal">
      <div class="banlist-header">
        <h2 class="banlist-title">禁卡表</h2>
        <button class="modal-close" id="banlistClose">✕</button>
      </div>
      <div class="banlist-body" id="banlistBody"></div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="admin.js"></script>
  <script src="impl-status.js"></script>
  <script src="duplicate-utils.js"></script>
  <script src="card-images.js"></script>
  <script src="card-modal-utils.js"></script>
  <script src="app.js"></script>

  <footer class="site-footer">
    圖片版權歸原出版社所有，本網站僅供玩家交流與推廣使用 ・ <a href="./about.html#donate" class="footer-donate-link">小額贊助支持</a>
  </footer>
</body>
</html>
